[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsync-desk"
version = "1.0.0"
description = "Python desktop rsync client with batch transfers, progress and encrypted credentials"
requires-python = ">=3.10"
dependencies = ["cryptography>=43,<48", "paramiko>=3.5,<6", "PySide6-Essentials>=6.8,<7"]

[project.gui-scripts]
rsync-desk = "rsync_client.__main__:main"

[tool.setuptools.packages.find]
include = ["rsync_client*"]

[tool.setuptools.package-data]
rsync_client = ["assets/*.png", "assets/*.svg"]
